# Release pipeline.
#
# 1. release-please reads the Conventional Commits merged into main and keeps a
#    "release PR" open that bumps .release-please-manifest.json and prepends
#    the next entry to CHANGELOG.md.
# 2. Merging that PR creates the vX.Y.Z tag and the GitHub Release.
# 3. The assets job verifies the tagged tree, attaches a CycloneDX SBOM, a
#    reproducible source archive and checksums, and warms the Go module proxy
#    so the version shows up on pkg.go.dev right away.
#
# Repository setting required: Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests".
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify tagged tree
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

      - name: Build release assets
        run: |
          mkdir -p dist
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            mod -licenses -json -output "dist/go-sdk-${TAG}.sbom.cdx.json"
          git archive --format=tar.gz --prefix="go-sdk-${TAG}/" \
            -o "dist/go-sdk-${TAG}.src.tar.gz" "${TAG}"
          (cd dist && sha256sum -- * > checksums.txt)

      - name: Upload release assets
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Warm the Go module proxy
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@${TAG}"
