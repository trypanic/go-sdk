# Release pipeline.
#
# 1. release-please reads the Conventional Commits merged into main and keeps a
#    "release PR" open that bumps .release-please-manifest.json and prepends
#    the next entry to CHANGELOG.md.
# 2. Merging that PR creates the vX.Y.Z tag and the GitHub Release.
# 3. The assets job smoke-checks the tagged tree (go.mod/go.sum tidy and
#    verified, build, vet, tests), attaches a CycloneDX SBOM, a reproducible
#    source archive and checksums, warms the Go module proxy so the version
#    shows up on pkg.go.dev right away, and records a signed SLSA build
#    provenance attestation for every asset listed in checksums.txt
#    (verify: gh attestation verify <asset> --repo trypanic/go-sdk).
#
# The gate is ci.yml, not this workflow. release-please below uses
# GITHUB_TOKEN, so its pushes and its PR trigger no workflow: before merging
# the release PR the maintainer runs
#   gh workflow run ci.yml --ref <release-please branch>
# (or "Run workflow" in the Actions UI) and merges only when it is green.
# With `main` protected by the ci.yml jobs as required checks (recommended,
# see ci.yml) the release PR cannot merge until that run is green. Convenience
# only: a GitHub App or fine-grained PAT token passed as `token:` would make
# CI start on the release PR by itself. By the time the assets job runs
# the tag is public and cannot be moved, so its checks are a smoke test; a
# failure there means `retract` plus a new patch.
#
# workflow_dispatch re-runs the assets job for an existing tag (e.g. after a
# failed upload) without touching release-please.
#
# Repository setting required: Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests". Recommended (owner action,
# confirm with a test PR first): branch protection on main with the ci.yml
# jobs as required status checks.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and re-upload assets for (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    # always(): on workflow_dispatch the release-please job is skipped.
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # contents: write is for the upload step; the token is exposed only there
    # (GH_TOKEN), never to go test or go run. Signing permissions live in the
    # separate attest job.
    permissions:
      contents: write
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag
        run: |
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "not a release tag: ${TAG}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # A patched toolchain, not the go.mod language floor (1.26.1 has
      # reachable standard-library vulnerabilities, X3-001).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      # Smoke check only: the gate is the ci.yml run on the release PR branch.
      - name: Smoke-check tagged tree
        run: |
          go mod verify
          go mod tidy -diff
          go build ./...
          go vet ./...
          go test -short ./...

      - name: Build release assets
        run: |
          mkdir -p dist
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            mod -licenses -json -output "dist/go-sdk-${TAG}.sbom.cdx.json"
          git archive --format=tar.gz --prefix="go-sdk-${TAG}/" \
            -o "dist/go-sdk-${TAG}.src.tar.gz" "${TAG}"
          (cd dist && sha256sum -- * > checksums.txt)

      # Handed to the attest job: the digests are all it needs.
      - id: checksums
        name: Export checksums
        run: |
          {
            echo "checksums<<CHECKSUMS_EOF"
            cat dist/checksums.txt
            echo "CHECKSUMS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Warm the Go module proxy
        run: |
          module=$(go list -m)
          GOPROXY=https://proxy.golang.org go list -m "${module}@${TAG}"

  # Separate job so the build and test steps never run with id-token or
  # attestations write. It runs after the upload and the proxy warm-up, so a
  # failure here (e.g. attestations unavailable for the repository's plan)
  # never blocks them. The subjects are the digests in checksums.txt.
  attest:
    needs: assets
    if: always() && needs.assets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing of the provenance attestation
      attestations: write
    steps:
      - name: Write checksums.txt
        env:
          CHECKSUMS: ${{ needs.assets.outputs.checksums }}
        run: printf '%s\n' "${CHECKSUMS}" > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt
