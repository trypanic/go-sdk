# Version updates for Go modules and the SHA-pinned GitHub Actions.
# Minor and patch updates are grouped into one weekly PR per ecosystem;
# major updates arrive as separate PRs.
#
# Commit titles follow Conventional Commits: Go module updates use
# `fix(deps):` (release-please cuts a patch release for them, as README
# "Releases" asks), Actions updates use `ci(deps):` (hidden, no release).
# All packages share one go.mod, so a single gomod entry covers them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
