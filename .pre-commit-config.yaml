default_install_hook_types: [pre-commit, commit-msg]
# Hooks without `stages` run on commit only (not again in commit-msg).
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]
        require_serial: true

      - id: go-test
        name: go test (short)
        entry: bash -c 'go test -short ./...'
        language: system
        pass_filenames: false
        types: [go]

      # Staged mode: only the staged .go files (and their packages).
      - id: staticanalysis
        name: staticanalysis (vet + staticcheck + semgrep, staged files)
        entry: bash scripts/staticanalysis.sh
        language: system
        pass_filenames: false
        types: [go]
        verbose: true

      # Full mode for `--all-files` runs. pre-commit does not tell a hook
      # whether it runs with --all-files, and with nothing staged the staged
      # hook above skips, so the full scan is a separate manual-stage hook:
      #   pre-commit run --all-files --hook-stage manual staticanalysis-full
      # (`task precommit:run` runs it).
      - id: staticanalysis-full
        name: staticanalysis (vet + staticcheck + semgrep, whole repo)
        entry: env QG_FULL=1 bash scripts/staticanalysis.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true
